name: Automatisation des tests DevSecOps

on:
  push:

jobs:
  Dependances:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperation du repository
        uses: actions/checkout@v4

      - name: Verification des fichiers dans le conteneur
        run: |
          docker run --rm \
            -v "$PWD:/project:ro" \
            alpine:3.22 \
            ls -l /project/requirements.txt

      - name: Controle des dependances avec Trivy
        run: |
          docker run --rm \
            -v "$PWD:/project:ro" \
            aquasec/trivy:latest fs \
            --scanners vuln \
            --detection-priority comprehensive \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            /project


  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances

    steps:
      - name: Recuperation du repository
        uses: actions/checkout@v4

      - name: Controle du Dockerfile avec Trivy
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/project \
            aquasec/trivy:latest config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            /project/Dockerfile

  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile

    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
